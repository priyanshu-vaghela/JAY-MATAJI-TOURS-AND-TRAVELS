<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 86" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4635"/>
      <stop offset="100%" stop-color="#122b20"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8214"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e29b38"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
  </defs>

  <!-- Emblem Crest -->
  <g transform="translate(4, 3)">
    <!-- Outer Shield/Circle -->
    <circle cx="40" cy="40" r="38" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="33.5" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.85"/>

    <!-- Rising Sun & Rays -->
    <path d="M 28 38 A 12 12 0 0 1 52 38 Z" fill="url(#sunGrad)"/>
    <line x1="40" y1="21" x2="40" y2="24" stroke="#ffd56b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="26" x2="31" y2="28" stroke="#ffd56b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="51" y1="26" x2="49" y2="28" stroke="#ffd56b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="34" x2="28" y2="34" stroke="#ffd56b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="34" x2="52" y2="34" stroke="#ffd56b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rolling Hills / Mountains -->
    <path d="M 12 52 Q 26 41 40 46 Q 54 41 68 52 L 68 62 A 34 34 0 0 1 12 62 Z" fill="#163929"/>

    <!-- Winding Highway / Road -->
    <path d="M 40 46 Q 37 56 32 68 L 48 68 Q 43 56 40 46 Z" fill="url(#goldGrad)"/>
    <!-- Road Centerline -->
    <path d="M 40 48 L 40 52 M 40 55 L 40 60 M 40 63 L 40 68" stroke="#122b20" stroke-width="1" stroke-linecap="round"/>

    <!-- North Star / Compass Peak -->
    <polygon points="40,9 41.8,14.2 47,15.5 42.5,18.8 44,24 40,20.8 36,24 37.5,18.8 33,15.5 38.2,14.2" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Block -->
  <!-- Main Brand Title -->
  <text x="98" y="43" fill="#193C2E" font-family="'Cinzel', 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="33" font-weight="800" letter-spacing="1">JAY MATAJI</text>

  <!-- Elegant Golden Dividing Rule with Diamond -->
  <path d="M 100 53 L 265 53 M 283 53 L 436 53" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="274,49 278,53 274,57 270,53" fill="#C9684D"/>

  <!-- Subtitle Tagline -->
  <text x="101" y="70" fill="#5D6140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="5.5">TOURS &amp; TRAVELS</text>
  <text x="365" y="70" fill="#a48c48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">GUJARAT</text>
</svg>
